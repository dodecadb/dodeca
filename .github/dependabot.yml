# Weekly pull requests for what DozenDB depends on, each tested by CI (doc/RELEASING.md). Security
# updates come at once, in pull requests of their own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New versions are proposed once they have been out for a week, not the day they appear.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Not for Neo4j: its releases carry Neo4j's security fixes.
    cooldown:
      default-days: 7
      exclude: ["org.neo4j:*"]
    groups:
      # A new Neo4j release: what a DozenDB release follows, so on its own.
      neo4j:
        patterns: ["org.neo4j:*"]
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["org.neo4j:*"]
    ignore:
      # The versions Neo4j ships in lib/, which DozenDB runs on: they change with Neo4j, by hand.
      - dependency-name: "org.slf4j:*"
      - dependency-name: "jakarta.ws.rs:jakarta.ws.rs-api"
      - dependency-name: "net.java.dev.jna:*"
      - dependency-name: "com.fasterxml.jackson.core:*"
