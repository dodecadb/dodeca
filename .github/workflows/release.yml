# Releases DozenDB when a version tag such as v0.2.0 is pushed (doc/RELEASING.md). CI packages that
# version from the tagged commit and runs every test against the jar; the jar then goes into an
# image on GHCR and onto a GitHub Release, each with an attestation of the workflow that built it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before the tests: the tag names a version and carries the release notes.
      - id: tag
        name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if ! [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not v and a version, such as v0.2.0 or v0.2.0-rc.1"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          notes=$(git for-each-ref --format='%(contents:body)' "refs/tags/$TAG")
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ] || [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::$TAG has no release notes: tag with git tag -a --cleanup=whitespace -F <notes>"
            exit 1
          fi
          prerelease=false
          [[ $version != *-* ]] || prerelease=true
          # The image's latest tag goes to the highest release, not to a patch of an older one.
          highest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          latest=false
          [ "$version" != "$highest" ] || latest=true
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: $/.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  image:
    name: Image
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image: ${{ steps.jar.outputs.image }}
      neo4j: ${{ steps.jar.outputs.neo4j }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dozendb-jar
          path: ${{ runner.temp }}/image
      - id: jar
        name: Read the jar's versions
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          jar=$(cd "$RUNNER_TEMP/image" && ls dozendb-*-neo4j-*.jar)
          manifest=$(unzip -p "$RUNNER_TEMP/image/$jar" META-INF/MANIFEST.MF | tr -d '\r')
          built=$(sed -n 's/^Implementation-Version: //p' <<< "$manifest")
          neo4j=$(sed -n 's/^DozenDB-Neo4j-Version: //p' <<< "$manifest")
          if [ "$built" != "$VERSION" ] || [ -z "$neo4j" ]; then
            echo "::error::$jar is version $built for Neo4j $neo4j, not version $VERSION"
            exit 1
          fi
          {
            echo "file=$jar"
            echo "neo4j=$neo4j"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dozendb"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.jar.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.version }}-neo4j-${{ steps.jar.outputs.neo4j }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=DozenDB
            org.opencontainers.image.description=Neo4j Community ${{ steps.jar.outputs.neo4j }} with DozenDB
            org.opencontainers.image.licenses=GPL-3.0-or-later
          annotations: |
            org.opencontainers.image.title=DozenDB
            org.opencontainers.image.description=Neo4j Community ${{ steps.jar.outputs.neo4j }} with DozenDB
            org.opencontainers.image.licenses=GPL-3.0-or-later
      # Only a COPY onto Neo4j's multi-platform image: both platforms build without emulation.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEO4J_VERSION=${{ steps.jar.outputs.neo4j }}
            DOZENDB_JAR=${{ steps.jar.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.jar.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dozendb-jar
          path: ${{ runner.temp }}/dist
      - name: Write the checksums
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum dozendb-*.jar > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/dozendb-*.jar
      # The notes from the tag, how to install and check this release, then GitHub's list of the
      # pull requests since the previous one.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          LATEST: ${{ needs.version.outputs.latest }}
          IMAGE: ${{ needs.image.outputs.image }}
          NEO4J: ${{ needs.image.outputs.neo4j }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          jar=$(cd "$RUNNER_TEMP/dist" && ls dozendb-*-neo4j-*.jar)
          {
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG"
            echo "## Installing"
            echo
            echo "For Neo4j Community $NEO4J, and only that version:"
            echo
            echo "- the jar, \`$jar\`, goes into Neo4j's \`lib/\`;"
            echo "- the image, \`$IMAGE:$VERSION\`, is Neo4j's official Community image with the jar:"
            echo "  \`docker pull $IMAGE:$VERSION\`."
            echo
            echo "To check that a download was built by this repository's release workflow:"
            echo
            echo '```sh'
            echo "gh attestation verify $jar --repo $GH_REPO"
            echo "gh attestation verify oci://$IMAGE:$VERSION --repo $GH_REPO"
            echo '```'
            echo
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "DozenDB $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            --prerelease="$PRERELEASE" --latest="$LATEST" \
            "$RUNNER_TEMP/dist/$jar" "$RUNNER_TEMP/dist/SHA256SUMS"
